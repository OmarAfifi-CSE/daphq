name: daphq
description: "A high-performance, raw TCP-based file transfer utility for seamless cross-platform data synchronization."
homepage: https://omarafifi-cse.github.io/daphq/
publish_to: 'none'

version: 3.0.0+10

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^13.3.3
  permission_handler: ^12.0.3
  flutter_bloc: ^9.1.1
  flutter_screenutil: ^5.9.3
  crypto: ^3.0.8
  window_manager: ^0.5.2
  flutter_foreground_task: ^11.0.3
  path: ^1.9.1
  http: ^1.6.0
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3
  path_provider: ^2.1.6
  device_info_plus: ^13.3.0
  connectivity_plus: ^7.3.2
  storage_space: ^1.4.0
  ffi: ^2.2.0
  flutter_markdown_plus: ^1.0.12
  open_filex: ^5.0.0
  basic_utils: ^5.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

